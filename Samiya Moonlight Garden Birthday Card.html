<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday, Samiya! 🥳💖 | December 28</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Great Vibes, Playfair Display, Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* Theme custom properties for dark emerald moonlight & golden lantern accents */
        :root {
            --emerald-night: #041512;
            --teal-deep: #092622;
            --amber-lantern: #fbbf24;
            --peach-glow: #fb7185;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at 75% 15%, #163e38 0%, #09211d 45%, #030e0c 100%);
            color: #fefce8;
            min-height: 100vh;
            overflow-x: hidden;
            margin: 0;
            user-select: none;
        }

        .font-script {
            font-family: 'Great Vibes', cursive;
        }

        .font-serif-display {
            font-family: 'Playfair Display', serif;
        }

        /* ================= 1. MOONLIGHT & GLOWING MOON ================= */
        .crescent-moon {
            position: fixed;
            top: 42px;
            right: 8%;
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #fef9c3 0%, #fde047 55%, #f59e0b 100%);
            box-shadow:
                0 0 45px rgba(253, 224, 71, 0.55),
                0 0 95px rgba(251, 191, 36, 0.25);
            z-index: 1;
            pointer-events: none;
            animation: moonPulse 6s ease-in-out infinite alternate;
        }

        @keyframes moonPulse {
            0% { transform: scale(1); box-shadow: 0 0 40px rgba(253, 224, 71, 0.5), 0 0 85px rgba(251, 191, 36, 0.2); }
            100% { transform: scale(1.05); box-shadow: 0 0 55px rgba(253, 224, 71, 0.72), 0 0 115px rgba(251, 191, 36, 0.35); }
        }

        /* Top Fairy Light String */
        @keyframes bulbTwinkle {
            0%, 100% { opacity: 0.45; transform: scale(0.92); }
            50% { opacity: 1; transform: scale(1.18); }
        }

        .fairy-bulb {
            animation: bulbTwinkle var(--t, 2.2s) ease-in-out infinite;
            animation-delay: var(--d, 0s);
        }

        /* ================= 2. WISHING LANTERN CURTAIN REVEAL ================= */
        #lanternOverlay {
            transition: opacity 0.9s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.9s;
        }

        #lanternOverlay.released {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        @keyframes heroLanternFloat {
            0%, 100% { transform: translateY(0px) rotate(-2deg); }
            50% { transform: translateY(-16px) rotate(2.5deg); }
        }

        .hero-lantern {
            animation: heroLanternFloat 3.4s ease-in-out infinite;
            transition: transform 1.1s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.9s ease;
        }

        .hero-lantern.flying-up {
            transform: translateY(-420px) scale(0.55) !important;
            opacity: 0;
        }

        /* ================= 3. GARDEN GLASSMORPHISM CARD ================= */
        .garden-card {
            background: linear-gradient(155deg, rgba(16, 52, 46, 0.62) 0%, rgba(5, 22, 19, 0.84) 100%);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(253, 224, 71, 0.28);
            box-shadow:
                0 28px 65px -12px rgba(0, 0, 0, 0.78),
                inset 0 1px 1px rgba(254, 249, 195, 0.25),
                0 0 45px rgba(251, 191, 36, 0.12);
            transition: box-shadow 0.7s ease, transform 0.2s ease-out;
        }

        .wish-spotlight-dim {
            box-shadow:
                0 28px 80px -12px rgba(0, 0, 0, 0.95),
                inset 0 0 95px rgba(2, 10, 8, 0.85),
                0 0 60px rgba(251, 191, 36, 0.32) !important;
        }

        /* ================= 4. CAKE, CANDLES & PARTY BUNNY ANIMATIONS ================= */
        @keyframes flameDance {
            0%, 100% { transform: scale(1) rotate(-3deg); opacity: 0.95; }
            35% { transform: scale(1.12, 0.9) rotate(3deg); opacity: 1; }
            70% { transform: scale(0.92, 1.08) rotate(-2deg); opacity: 0.88; }
        }

        .flame-anim {
            transform-origin: center bottom;
            animation: flameDance 0.82s infinite ease-in-out;
            transition: opacity 0.45s ease, transform 0.45s ease;
        }

        .flame-anim.extinguished {
            opacity: 0 !important;
            transform: scale(0) translateY(-12px) !important;
            animation: none;
        }

        @keyframes smokeRise {
            0% { opacity: 0; transform: translateY(0) scale(0.4); }
            30% { opacity: 0.85; }
            100% { opacity: 0; transform: translateY(-58px) translateX(14px) scale(2.2); }
        }

        .smoke-wisp {
            opacity: 0;
        }

        .smoke-wisp.rising {
            animation: smokeRise 2.3s ease-out forwards;
        }

        @keyframes bunnyKnifeIdle {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-6px) rotate(-4deg); }
        }

        .bunny-knife-idle {
            transform-origin: 330px 196px;
            animation: bunnyKnifeIdle 2.1s ease-in-out infinite;
        }

        @keyframes bunnyKnifeCut {
            0% { transform: rotate(0deg) translate(0, 0); }
            35% { transform: rotate(-34deg) translate(-24px, 42px); }
            65% { transform: rotate(-34deg) translate(-24px, 42px); }
            100% { transform: rotate(-56deg) translate(12px, -24px); }
        }

        .bunny-knife-cutting {
            transform-origin: 330px 196px;
            animation: bunnyKnifeCut 1.45s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes bunnyCheerBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .bunny-cheering {
            animation: bunnyCheerBounce 0.72s ease-in-out infinite;
        }

        @keyframes bunnyArmWave {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(-24deg); }
        }

        .bunny-left-cheer {
            transform-origin: 376px 196px;
            animation: bunnyArmWave 0.6s ease-in-out infinite;
        }

        .cake-slice-plate {
            transition: transform 1.25s cubic-bezier(0.22, 1, 0.36, 1) 0.5s;
        }

        .cake-slice-plate.served {
            transform: translate(-44px, 18px) rotate(-5deg);
        }

        /* ================= 5. VIDEO-STYLE STORYTELLING CAPTIONS & TYPEWRITER ================= */
        @keyframes storyPop {
            0% { opacity: 0; transform: translateY(10px) scale(0.92); filter: blur(4px); }
            100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
        }

        .story-pop {
            animation: storyPop 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes waveTitleLetter {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            35% { transform: translateY(-8px) rotate(-3deg); }
            70% { transform: translateY(3px) rotate(2deg); }
        }

        .wave-char {
            display: inline-block;
            animation: waveTitleLetter 2.8s ease-in-out infinite;
        }

        @keyframes lineRevealUp {
            0% { opacity: 0; transform: translateY(16px); filter: blur(3px); }
            100% { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        .story-line-hidden {
            opacity: 0;
            transform: translateY(16px);
        }

        .story-line-visible {
            animation: lineRevealUp 0.75s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        .typing-cursor {
            display: inline-block;
            width: 2.5px;
            height: 1.15em;
            background: #fde047;
            margin-left: 3px;
            vertical-align: text-bottom;
            animation: blinkCursor 0.7s infinite;
        }

        @keyframes blinkCursor {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        /* ================= 6. LANTERN GOLD BUTTON SHIMMER & TAP PULSE ================= */
        @keyframes lanternBtnGlow {
            0% { background-position: 0% 50%; box-shadow: 0 8px 25px rgba(245, 158, 11, 0.45); }
            50% { background-position: 100% 50%; box-shadow: 0 12px 34px rgba(244, 63, 94, 0.65); }
            100% { background-position: 0% 50%; box-shadow: 0 8px 25px rgba(245, 158, 11, 0.45); }
        }

        .btn-lantern-gold {
            background: linear-gradient(135deg, #f59e0b, #f43f5e, #fbbf24, #f43f5e);
            background-size: 300% 300%;
            animation: lanternBtnGlow 3.2s ease infinite;
        }
    </style>
</head>
<body class="relative flex flex-col items-center justify-between">

    <!-- ==================== TOP FAIRY LIGHTS GARLAND ==================== -->

    <script>
        /* ============================================================================
           1. EXACT MESSAGE & VIDEO-STYLE SEQUENTIAL STORYTELLING
        ============================================================================ */
        const EXACT_WISH_TEXT = `Happy Birthday, Samiya! 🥳💖

Ajker ei special dine tomar jonno roilo onek onek shubhokamna. Allah jeno tomake sobsomoy sustho o bhalo rakhen. Tomar jiboner protiti din jeno anondo ar shantite vore thake. Allah jeno tomar moner sob bhalo iccha puron koren ebong jiboner protiti khetre sofolota dan koren. Sob somoy hasi-khushi thako, nijer kheyal rekho.

Many many happy returns of the day! ❤️🎂`;

        const LINE_1_TEXT = "Happy Birthday, Samiya! 🥳💖";
        const LINE_2_TEXT = "Ajker ei special dine tomar jonno roilo onek onek shubhokamna. Allah jeno tomake sobsomoy sustho o bhalo rakhen. Tomar jiboner protiti din jeno anondo ar shantite vore thake. Allah jeno tomar moner sob bhalo iccha puron koren ebong jiboner protiti khetre sofolota dan koren. Sob somoy hasi-khushi thako, nijer kheyal rekho.";
        const LINE_3_TEXT = "Many many happy returns of the day! ❤️🎂";

        let cakeStage = 0; // 0 = lit, 1 = wish & blown out, 2 = sliced & message revealed
        let storyTimers = [];

        function clearStoryTimers() {
            storyTimers.forEach(id => clearTimeout(id));
            storyTimers = [];
        }

        function scheduleStep(fn, delay) {
            const id = setTimeout(fn, delay);
            storyTimers.push(id);
            return id;
        }

        function buildWaveHeroTitle() {
            const el = document.getElementById('waveHeroTitle');
            const text = "Happy Birthday, Samiya! 🥳💖";
            el.innerHTML = '';
            Array.from(text).forEach((char, idx) => {
                const span = document.createElement('span');
                span.innerHTML = char === ' ' ? '&nbsp;' : char;
                span.className = 'wave-char';
                span.style.animationDelay = `${idx * 0.08}s`;
                if (idx >= 16 && idx <= 22) {
                    span.classList.add('text-amber-300');
                }
                el.appendChild(span);
            });
        }

        function setStoryCaption(icon, text) {
            const badge = document.getElementById('cakeStatusBadge');
            document.getElementById('statusIcon').textContent = icon;
            document.getElementById('statusCaption').textContent = text;
            badge.classList.remove('story-pop');
            void badge.offsetWidth;
            badge.classList.add('story-pop');
        }

        function typewriteParagraph(element, fullText, speedMs, onComplete) {
            element.classList.remove('story-line-hidden');
            element.classList.add('story-line-visible');
            element.textContent = '';

            const cursor = document.createElement('span');
            cursor.className = 'typing-cursor';
            element.appendChild(cursor);

            let idx = 0;
            function step() {
                if (idx < fullText.length) {
                    cursor.before(document.createTextNode(fullText[idx]));
                    idx++;
                    const delay = (fullText[idx - 1] === '.' || fullText[idx - 1] === ',') ? speedMs * 4 : speedMs;
                    scheduleStep(step, delay);
                } else {
                    cursor.remove();
                    if (onComplete) onComplete();
                }
            }
            step();
        }

        function startKothaMessageAnimation() {
            const kothaBadge = document.getElementById('kothaHeaderBadge');
            const line1 = document.getElementById('wishLine1');
            const line2 = document.getElementById('wishLine2');
            const line3 = document.getElementById('wishLine3');
            const footerControls = document.getElementById('wishFooterControls');

            kothaBadge.style.opacity = '0';
            [line1, line2, line3].forEach(el => {
                el.classList.remove('story-line-visible');
                el.classList.add('story-line-hidden');
                el.textContent = '';
            });
            footerControls.style.opacity = '0';

            scheduleStep(() => {
                kothaBadge.style.opacity = '1';
                kothaBadge.classList.add('story-pop');
            }, 250);

            scheduleStep(() => {
                line1.textContent = LINE_1_TEXT;
                line1.classList.remove('story-line-hidden');
                line1.classList.add('story-line-visible');
            }, 850);

            scheduleStep(() => {
                typewriteParagraph(line2, LINE_2_TEXT, 22, () => {
                    scheduleStep(() => {
                        line3.textContent = LINE_3_TEXT;
                        line3.classList.remove('story-line-hidden');
                        line3.classList.add('story-line-visible');
                        footerControls.style.opacity = '1';
                        spawnCelebrationParticles(window.innerWidth * 0.5, window.innerHeight * 0.65, 55);
                    }, 350);
                });
            }, 1550);
        }

        /* ============================================================================
           2. WISHING LANTERN RELEASE & CANDLE LIGHTING SEQUENCE
        ============================================================================ */
        function releaseWishLantern() {
            const lantern = document.getElementById('heroLanternBox');
            const overlay = document.getElementById('lanternOverlay');
            const mainStage = document.getElementById('mainStage');

            if (lantern.classList.contains('flying-up')) return;
            lantern.classList.add('flying-up');

            if (!isMusicPlaying) {
                startMusicBox();
            }

            spawnCelebrationParticles(window.innerWidth / 2, window.innerHeight / 2, 70);

            setTimeout(() => {
                overlay.classList.add('released');
                mainStage.classList.remove('opacity-0');
                runCandleLightingSequence();
            }, 900);
        }

        function runCandleLightingSequence() {
            clearStoryTimers();
            setStoryCaption('🕯️', 'Mombatti jalano hocche...');

            ['flame1', 'glow1', 'flame2', 'glow2', 'flame3', 'glow3'].forEach(id => {
                const el = document.getElementById(id);
                el.style.opacity = '0';
                el.classList.remove('extinguished');
            });

            scheduleStep(() => {
                document.getElementById('flame1').style.opacity = '';
                document.getElementById('glow1').style.opacity = '';
            }, 400);

            scheduleStep(() => {
                document.getElementById('flame2').style.opacity = '';
                document.getElementById('glow2').style.opacity = '';
            }, 900);

            scheduleStep(() => {
                document.getElementById('flame3').style.opacity = '';
                document.getElementById('glow3').style.opacity = '';
            }, 1400);

            scheduleStep(() => {
                setStoryCaption('👆', 'Click Here to Blow Candles & Make a Wish ✨');
            }, 2100);
        }

        /* ============================================================================
           3. CAKE BLOWING, WISHING & SLICING CHOREOGRAPHY
        ============================================================================ */
        function handleCakeAction() {
            const btnIcon = document.getElementById('btnIcon');
            const btnLabel = document.getElementById('btnLabel');
            const gardenCard = document.getElementById('gardenCard');

            if (cakeStage === 0) {
                cakeStage = 1;
                ['flame1', 'flame2', 'flame3', 'glow1', 'glow2', 'glow3'].forEach(id => {
                    document.getElementById(id).classList.add('extinguished');
                });
                ['smoke1', 'smoke2', 'smoke3'].forEach((id, idx) => {
                    const smoke = document.getElementById(id);
                    smoke.classList.remove('rising');
                    void smoke.offsetWidth;
                    setTimeout(() => smoke.classList.add('rising'), idx * 140);
                });

                gardenCard.classList.add('wish-spotlight-dim');
                setStoryCaption('✨', 'Mone mone ekta wish koro ✨');
                btnIcon.textContent = '🔪';
                btnLabel.textContent = 'Click Here to Cut Cake 🎂';
                spawnCelebrationParticles(window.innerWidth * 0.45, window.innerHeight * 0.4, 30);

                // Auto-advance to cake cutting after 2.5 seconds if user watches hands-free
                scheduleStep(() => {
                    if (cakeStage === 1) {
                        handleCakeAction();
                    }
                }, 2500);

            } else if (cakeStage === 1) {
                cakeStage = 2;
                gardenCard.classList.remove('wish-spotlight-dim');

                const knifeArm = document.getElementById('bunnyKnifeArm');
                knifeArm.classList.remove('bunny-knife-idle');
                knifeArm.classList.add('bunny-knife-cutting');

                setStoryCaption('🔪', 'Ebar kek kata... Happy Birthday Samiya! 🎉');
                btnIcon.textContent = '🎉';
                btnLabel.textContent = 'Happy Birthday, Samiya! 🥳';

                scheduleStep(() => {
                    document.getElementById('cakeSliceGroup').classList.add('served');
                    document.getElementById('partyBunny').classList.add('bunny-cheering');
                    document.getElementById('bunnyLeftArm').classList.add('bunny-left-cheer');
                    setStoryCaption('🥳', 'Happy Birthday, Samiya! 🎉💖');

                    spawnCelebrationParticles(window.innerWidth * 0.45, window.innerHeight * 0.42, 95);
                    releaseExtraLanternBurst();

                    scheduleStep(() => {
                        document.getElementById('messageCardSection').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                        startKothaMessageAnimation();
                    }, 900);
                }, 700);

            } else {
                spawnCelebrationParticles(window.innerWidth * 0.5, window.innerHeight * 0.45, 70);
                releaseExtraLanternBurst();
            }
        }

        function replayAllAnimations() {
            clearStoryTimers();
            cakeStage = 0;

            document.getElementById('gardenCard').classList.remove('wish-spotlight-dim');
            ['smoke1', 'smoke2', 'smoke3'].forEach(id => document.getElementById(id).classList.remove('rising'));

            const knifeArm = document.getElementById('bunnyKnifeArm');
            knifeArm.classList.remove('bunny-knife-cutting');
            knifeArm.classList.add('bunny-knife-idle');
            document.getElementById('partyBunny').classList.remove('bunny-cheering');
            document.getElementById('bunnyLeftArm').classList.remove('bunny-left-cheer');
            document.getElementById('cakeSliceGroup').classList.remove('served');

            document.getElementById('kothaHeaderBadge').style.opacity = '0';
            document.getElementById('wishFooterControls').style.opacity = '0';
            ['wishLine1', 'wishLine2', 'wishLine3'].forEach(id => {
                const el = document.getElementById(id);
                el.classList.remove('story-line-visible');
                el.classList.add('story-line-hidden');
                el.textContent = '';
            });

            document.getElementById('btnIcon').textContent = '👆';
            document.getElementById('btnLabel').textContent = 'Click Here to Blow Candles 🕯️';

            window.scrollTo({ top: 0, behavior: 'smooth' });
            runCandleLightingSequence();
        }

        function copyWishToClipboard() {
            const btnText = document.getElementById('copyBtnText');
            const done = () => {
                btnText.textContent = 'Copied for Samiya! 💖';
                spawnCelebrationParticles(window.innerWidth / 2, window.innerHeight * 0.75, 30);
                setTimeout(() => { btnText.textContent = 'Copy Wish 💖'; }, 2400);
            };
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(EXACT_WISH_TEXT).then(done).catch(() => fallbackCopy(done));
            } else {
                fallbackCopy(done);
            }
        }

        function fallbackCopy(cb) {
            const ta = document.createElement('textarea');
            ta.value = EXACT_WISH_TEXT;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            cb();
        }

        /* ============================================================================
           4. OFFLINE POLYPHONIC MUSIC BOX ("HAPPY BIRTHDAY")
        ============================================================================ */
        let audioCtx = null;
        let isMusicPlaying = false;
        let melodyTimeout = null;

        const BIRTHDAY_NOTES = [
            { f: 261.63, d: 0.35 }, { f: 261.63, d: 0.25 }, { f: 293.66, d: 0.6 }, { f: 261.63, d: 0.6 }, { f: 349.23, d: 0.6 }, { f: 329.63, d: 1.1 },
            { f: 261.63, d: 0.35 }, { f: 261.63, d: 0.25 }, { f: 293.66, d: 0.6 }, { f: 261.63, d: 0.6 }, { f: 392.00, d: 0.6 }, { f: 349.23, d: 1.1 },
            { f: 261.63, d: 0.35 }, { f: 261.63, d: 0.25 }, { f: 523.25, d: 0.6 }, { f: 440.00, d: 0.6 }, { f: 349.23, d: 0.6 }, { f: 329.63, d: 0.6 }, { f: 293.66, d: 1.1 },
            { f: 466.16, d: 0.35 }, { f: 466.16, d: 0.25 }, { f: 440.00, d: 0.6 }, { f: 349.23, d: 0.6 }, { f: 392.00, d: 0.6 }, { f: 349.23, d: 1.3 }
        ];

        function playNote(freq, dur) {
            if (!audioCtx || !isMusicPlaying) return;
            try {
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const harm = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                harm.type = 'triangle';
                osc.frequency.setValueAtTime(freq, now);
                harm.frequency.setValueAtTime(freq * 2, now);
                gain.gain.setValueAtTime(0.001, now);
                gain.gain.exponentialRampToValueAtTime(0.11, now + 0.03);
                gain.gain.exponentialRampToValueAtTime(0.0008, now + dur * 1.35);
                osc.connect(gain);
                harm.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                harm.start(now);
                osc.stop(now + dur * 1.4);
                harm.stop(now + dur * 1.4);
            } catch (err) {
                console.error('Audio note playback failed:', err);
            }
        }

        function startMusicBox() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                isMusicPlaying = true;
                document.getElementById('musicEmoji').textContent = '🎶';
                document.getElementById('musicText').textContent = 'Music Box: On';

                let idx = 0;
                function next() {
                    if (!isMusicPlaying) return;
                    const n = BIRTHDAY_NOTES[idx % BIRTHDAY_NOTES.length];
                    playNote(n.f, n.d);
                    idx++;
                    melodyTimeout = setTimeout(next, (idx % BIRTHDAY_NOTES.length === 0) ? 1400 : n.d * 780);
                }
                next();
            } catch (err) {
                console.error('Music box failed to start:', err);
            }
        }

        function toggleMusicBox() {
            if (isMusicPlaying) {
                isMusicPlaying = false;
                clearTimeout(melodyTimeout);
                document.getElementById('musicEmoji').textContent = '🎵';
                document.getElementById('musicText').textContent = 'Music Box: Off';
            } else {
                startMusicBox();
            }
        }

        /* ============================================================================
           5. GARDEN CANVAS: FIREFLIES, STARS & FLOATING WISH LANTERNS
        ============================================================================ */
        const gardenCanvas = document.getElementById('gardenCanvas');
        const gCtx = gardenCanvas.getContext('2d');
        const fxCanvas = document.getElementById('fxCanvas');
        const fxCtx = fxCanvas.getContext('2d');

        let fireflies = [];
        let skyLanterns = [];
        let particles = [];

        function resizeCanvases() {
            gardenCanvas.width = window.innerWidth;
            gardenCanvas.height = window.innerHeight;
            fxCanvas.width = window.innerWidth;
            fxCanvas.height = window.innerHeight;
        }

        function initGarden() {
            fireflies = Array.from({ length: 65 }, () => ({
                x: Math.random() * gardenCanvas.width,
                y: Math.random() * gardenCanvas.height,
                r: Math.random() * 2.4 + 1,
                vx: (Math.random() - 0.5) * 0.45,
                vy: (Math.random() - 0.5) * 0.45,
                phase: Math.random() * Math.PI * 2
            }));

            skyLanterns = Array.from({ length: 14 }, () => createLantern(true));
        }

        function createLantern(randomY = false) {
            return {
                x: Math.random() * gardenCanvas.width,
                y: randomY ? Math.random() * gardenCanvas.height : gardenCanvas.height + 40 + Math.random() * 120,
                w: Math.random() * 14 + 14,
                h: Math.random() * 18 + 18,
                vy: -(Math.random() * 0.55 + 0.3),
                sway: Math.random() * Math.PI * 2
            };
        }

        function releaseExtraLanternBurst() {
            for (let i = 0; i < 8; i++) {
                skyLanterns.push(createLantern(false));
            }
            spawnCelebrationParticles(window.innerWidth * 0.5, window.innerHeight * 0.45, 45);
        }

        function animateGarden() {
            gCtx.clearRect(0, 0, gardenCanvas.width, gardenCanvas.height);

            // Fireflies
            fireflies.forEach(f => {
                f.x += f.vx;
                f.y += f.vy;
                f.phase += 0.035;
                if (f.x < 0) f.x = gardenCanvas.width;
                if (f.x > gardenCanvas.width) f.x = 0;
                if (f.y < 0) f.y = gardenCanvas.height;
                if (f.y > gardenCanvas.height) f.y = 0;

                const alpha = 0.25 + 0.75 * Math.abs(Math.sin(f.phase));
                const glow = gCtx.createRadialGradient(f.x, f.y, 0.5, f.x, f.y, f.r * 4);
                glow.addColorStop(0, `rgba(254, 240, 138, ${alpha})`);
                glow.addColorStop(1, 'rgba(52, 211, 153, 0)');
                gCtx.fillStyle = glow;
                gCtx.beginPath();
                gCtx.arc(f.x, f.y, f.r * 4, 0, Math.PI * 2);
                gCtx.fill();
            });

            // Floating Sky Lanterns
            for (let i = skyLanterns.length - 1; i >= 0; i--) {
                const l = skyLanterns[i];
                l.y += l.vy;
                l.sway += 0.015;
                l.x += Math.sin(l.sway) * 0.35;

                if (l.y < -60) {
                    if (skyLanterns.length > 14) {
                        skyLanterns.splice(i, 1);
                        continue;
                    } else {
                        Object.assign(l, createLantern(false));
                    }
                }

                const halo = gCtx.createRadialGradient(l.x, l.y, 2, l.x, l.y, l.w * 2.1);
                halo.addColorStop(0, 'rgba(251, 191, 36, 0.45)');
                halo.addColorStop(1, 'rgba(234, 88, 12, 0)');
                gCtx.fillStyle = halo;
                gCtx.beginPath();
                gCtx.arc(l.x, l.y, l.w * 2.1, 0, Math.PI * 2);
                gCtx.fill();

                gCtx.fillStyle = 'rgba(253, 224, 71, 0.85)';
                gCtx.beginPath();
                gCtx.roundRect(l.x - l.w / 2, l.y - l.h / 2, l.w, l.h, 5);
                gCtx.fill();
            }

            requestAnimationFrame(animateGarden);
        }

        const GARDEN_COLORS = ['#fbbf24', '#fde047', '#fb7185', '#f43f5e', '#34d399', '#6ee7b7', '#ffffff'];

        function spawnCelebrationParticles(ox, oy, count = 50) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 6.5 + 2;
                const isHeart = Math.random() < 0.38;
                particles.push({
                    x: ox,
                    y: oy,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 2.4,
                    gravity: isHeart ? -0.02 : 0.14,
                    size: Math.random() * 7 + 5,
                    color: GARDEN_COLORS[Math.floor(Math.random() * GARDEN_COLORS.length)],
                    rot: Math.random() * 360,
                    vRot: (Math.random() - 0.5) * 10,
                    isHeart,
                    life: 1
                });
            }
        }

        function drawHeart(ctx, x, y, size, color, alpha) {
            ctx.save();
            ctx.globalAlpha = Math.max(0, alpha);
            ctx.fillStyle = color;
            ctx.beginPath();
            const h = size * 0.3;
            ctx.moveTo(x, y + h);
            ctx.bezierCurveTo(x, y, x - size / 2, y, x - size / 2, y + h);
            ctx.bezierCurveTo(x - size / 2, y + (size + h) / 2, x, y + (size + h) / 1.3, x, y + size);
            ctx.bezierCurveTo(x, y + (size + h) / 1.3, x + size / 2, y + (size + h) / 2, x + size / 2, y + h);
            ctx.bezierCurveTo(x + size / 2, y, x, y, x, y + h);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }

        function animateFx() {
            fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += p.gravity;
                p.vx *= 0.985;
                p.rot += p.vRot;
                p.life -= 0.013;

                if (p.isHeart) {
                    drawHeart(fxCtx, p.x, p.y, p.size * 1.4, p.color, p.life);
                } else {
                    fxCtx.save();
                    fxCtx.globalAlpha = Math.max(0, p.life);
                    fxCtx.translate(p.x, p.y);
                    fxCtx.rotate((p.rot * Math.PI) / 180);
                    fxCtx.fillStyle = p.color;
                    fxCtx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size * 0.55);
                    fxCtx.restore();
                }
                if (p.life <= 0) particles.splice(i, 1);
            }
            requestAnimationFrame(animateFx);
        }

        window.addEventListener('resize', resizeCanvases);
        resizeCanvases();
        initGarden();
        buildWaveHeroTitle();
        animateGarden();
        animateFx();
    </script>
